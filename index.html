<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f5"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Daily Bloom">
<title>Daily Bloom — يومك بلطف</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--pink:#e9a9b8;--pink2:#f8dce2;--rose:#b96f83;--cream:#fff8f4;--paper:#fffdfb;--ink:#59464b;--muted:#a58d91;--green:#8aa58b;--line:#f2e5e3;--shadow:0 12px 35px #bd8c8c18}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 4%,#fce8ec 0,transparent 25%),linear-gradient(145deg,#fff9f5,#fff3f3);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:22px 15px calc(35px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:15px;background:#f8dce2;display:grid;place-items:center;font-size:23px;box-shadow:0 5px 14px #d99bab33}.brand h1{font-size:20px;margin:0;color:#9c6374;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.date-chip{background:#fffdfb;border:1px solid var(--line);padding:9px 13px;border-radius:15px;color:#9c7180;font-size:12px}
.hero{background:linear-gradient(120deg,#f7dce2,#fbece8 75%);border-radius:27px;padding:23px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:'✿';position:absolute;left:19px;top:4px;font-size:78px;color:#fff8f5a6;transform:rotate(-18deg)}.hero h2{font-size:23px;margin:0 0 5px;color:#895969}.hero p{margin:0;color:#9b737d;font-size:13px}.progress-wrap{margin-top:20px;display:flex;align-items:center;gap:12px;max-width:390px}.progress{height:8px;border-radius:20px;background:#fff9f5;overflow:hidden;flex:1}.progress span{height:100%;display:block;width:0;background:#bd7e90;border-radius:20px;transition:width .25s}.progress-label{font-size:11px;color:#966979;white-space:nowrap}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px;gap:10px}.toolbar h3{margin:0;font-size:17px}.add{border:0;background:#b9798d;color:white;padding:10px 16px;border-radius:14px;box-shadow:0 6px 15px #b9798d35;font-weight:600}.add:active{transform:scale(.97)}.daynav{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.daynav::-webkit-scrollbar{display:none}.day{border:1px solid var(--line);background:#fffdfb;border-radius:15px;min-width:57px;padding:9px 7px;color:var(--muted);text-align:center}.day b{display:block;font-size:17px;color:var(--ink);line-height:1.25}.day small{font-size:10px}.day em{display:block;font-style:normal;font-size:9px;color:#b49ba1;margin-top:2px}.day.active em{color:#fff0f3}.day.active{background:#bd7e90;border-color:#bd7e90;color:white}.day.active b{color:white}.filters{display:flex;gap:7px;margin:8px 0 13px;flex-wrap:wrap}.date-tools{display:flex;align-items:center;gap:8px}.selected-date{font-size:11px;color:#aa818c;margin-top:3px}.jump-date{width:37px;height:37px;border:1px solid var(--line);border-radius:12px;background:#fffdfb;color:#9b6c7b;padding:7px}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-heading h3{margin:0;font-size:17px}.week-caption{font-size:10px;color:#b0939b;margin:0 2px 7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 17px}.stat{background:#fffdfb;border:1px solid var(--line);border-radius:15px;padding:10px 11px}.stat b{display:block;font-size:17px;color:#986477}.stat small{font-size:10px;color:#aa9298}.filter{border:1px solid var(--line);background:#fffdfb;color:#9b7e84;border-radius:20px;padding:6px 12px;font-size:11px}.filter.active{background:#f7e1e6;color:#9c6374;border-color:#f2d0d9}
.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:12px;background:#fffdfb;border:1px solid #f3e8e5;border-radius:18px;padding:13px 14px;box-shadow:0 5px 17px #bd8c8c0b;transition:.2s}.task.done{opacity:.67;background:#fbf9f6}.check{width:25px;height:25px;flex:0 0 25px;border:1.7px solid #dfb5c0;border-radius:9px;background:white;color:white;display:grid;place-items:center;font-size:15px}.done .check{background:#91ad94;border-color:#91ad94}.task-info{flex:1;min-width:0}.task-title{font-size:14px;font-weight:600;overflow-wrap:anywhere}.done .task-title{text-decoration:line-through;color:#aa9a9a}.task-meta{font-size:10px;color:#b39ba0;margin-top:3px}.tag{font-size:10px;padding:5px 8px;border-radius:9px;background:#f9edf0;color:#a56e7e;white-space:nowrap}.tag.weekly{background:#f4efe6;color:#a18a61}.tag.once{background:#edf3ed;color:#78927b}.delete{border:0;background:transparent;color:#c5aeb2;font-size:17px;padding:3px 4px}.empty{text-align:center;padding:34px 15px;background:#fffdfb;border:1px dashed #ead4d8;border-radius:20px;color:#aa9298}.empty div{font-size:32px;margin-bottom:7px}.empty b{display:block;color:#8f6874;font-size:14px}.empty small{font-size:11px}
.footer{text-align:center;color:#b69ca2;font-size:11px;margin:24px 0 5px}.footer span{color:#c17e91}
.overlay{position:fixed;inset:0;background:#4c343b55;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.overlay.show{display:flex}.modal{background:#fffaf7;border-radius:25px 25px 20px 20px;padding:22px;width:min(100%,480px);box-shadow:0 15px 50px #573b4433;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal h3{margin:0;color:#986477;font-size:18px}.close{border:0;background:#f8e8eb;color:#9e7180;border-radius:10px;width:32px;height:32px;font-size:19px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#8e7078;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #efdddf;border-radius:13px;padding:12px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#d69aaa;box-shadow:0 0 0 3px #f7e5e9}.fields-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.submit{width:100%;border:0;background:#b9798d;color:white;padding:13px;border-radius:14px;margin-top:10px;font-weight:600}.hint{font-size:10px;color:#b19a9f;margin-top:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#76515d;color:white;padding:10px 16px;border-radius:13px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:600px){body{padding-top:35px}.overlay{align-items:center}.modal{border-radius:25px}.hero{padding:28px 30px}.hero h2{font-size:26px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">🌷</div><div><h1>Daily Bloom</h1><small>خطوة صغيرة، يوم أجمل</small></div></div><div class="date-chip" id="todayLabel"></div></header>
<section class="hero"><h2 id="greeting">أهلاً في يومك الجميل ✨</h2><p>خدي نفس عميق… وخلينا ننجز شوي شوي.</p><div class="progress-wrap"><div class="progress"><span id="progressBar"></span></div><div class="progress-label" id="progressText">0 من 0 مهام</div></div></section>
<div class="toolbar"><div class="section-heading"><div><h3>مهام اليوم <span>🌸</span></h3><div class="selected-date" id="selectedDateLabel"></div></div></div><div class="date-tools"><input class="jump-date" id="jumpDate" type="date" aria-label="اختاري تاريخاً" title="اختاري تاريخاً"><button class="add" id="openModal">＋ أضيفي</button></div></div>
<div class="week-caption" id="weekCaption">أيام الأسبوع</div><nav class="daynav" id="dayNav"></nav>
<div class="stats"><div class="stat"><b id="totalStat">0</b><small>مهام اليوم</small></div><div class="stat"><b id="doneStat">0</b><small>مكتملة</small></div><div class="stat"><b id="leftStat">0</b><small>متبقية</small></div></div>
<div class="filters" id="filters"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="active">المتبقي</button><button class="filter" data-filter="done">المكتمل</button></div>
<section class="tasks" id="taskList"></section>
<div class="footer">صُنع بحب ليومك 💗 <span>✿</span></div>
</main>
<div class="overlay" id="overlay"><form class="modal" id="taskForm"><div class="modal-head"><h3>مهمة جديدة ✿</h3><button type="button" class="close" id="closeModal">×</button></div>
<div class="field"><label for="taskName">شو حابة تنجزي؟</label><input id="taskName" maxlength="80" placeholder="مثلاً: أدرس ساعة برمجة…" required></div>
<div class="field"><label for="taskType">نوع المهمة</label><select id="taskType"><option value="daily">كل يوم</option><option value="weekly">أيام محددة من الأسبوع</option><option value="once">مرة واحدة فقط</option></select></div>
<div class="field" id="weekField" hidden><label>اختاري أيام التكرار</label><div style="display:flex;gap:7px;flex-wrap:wrap" id="weekDays"></div><div class="hint">فيني تختاري أكتر من يوم.</div></div>
<div class="field" id="dateField" hidden><label for="taskDate">تاريخ المهمة</label><input id="taskDate" type="date"></div>
<button class="submit" type="submit">حفظ المهمة 💗</button></form></div><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];const SHORT=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];const KEY='daily-bloom-v1';let selectedDate=startOfDay(new Date()),filter='all',tasks=load();
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function keyDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isDue(t,date){let k=keyDate(date);if(t.type==='daily')return true;if(t.type==='weekly')return t.days.includes(date.getDay());return t.date===k}function isDone(t,date){return !!t.completed?.[keyDate(date)]}function visibleTasks(){return tasks.filter(t=>isDue(t,selectedDate)).filter(t=>filter==='all'||(filter==='done'?isDone(t,selectedDate):!isDone(t,selectedDate)))}
function render(){let now=new Date();$('todayLabel').textContent=now.toLocaleDateString('ar',{weekday:'short',day:'numeric',month:'long',year:'numeric'});$('selectedDateLabel').textContent=selectedDate.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('jumpDate').value=keyDate(selectedDate);$('greeting').textContent=keyDate(selectedDate)===keyDate(now)?'أهلاً في يومك الجميل ✨':`خطة ${DAYS[selectedDate.getDay()]}ك اللطيفة 🌷`;renderDays();let due=tasks.filter(t=>isDue(t,selectedDate)),done=due.filter(t=>isDone(t,selectedDate)).length;$('totalStat').textContent=due.length;$('doneStat').textContent=done;$('leftStat').textContent=due.length-done;$('progressBar').style.width=(due.length?done/due.length*100:0)+'%';$('progressText').textContent=`${done} من ${due.length} مهام`;
let list=visibleTasks();$('taskList').innerHTML=list.length?list.map(t=>{let d=isDone(t,selectedDate);let type=t.type==='daily'?'يومي':t.type==='weekly'?'أسبوعي':'لمرة واحدة';let sub=t.type==='weekly'?t.days.map(x=>SHORT[x]).join('، '):t.type==='once'?parseDate(t.date).toLocaleDateString('ar',{day:'numeric',month:'short'}):'يتكرر كل يوم';return `<article class="task ${d?'done':''}"><button class="check" data-check="${t.id}" aria-label="تحديد كمكتملة">${d?'✓':''}</button><div class="task-info"><div class="task-title">${escapeHtml(t.name)}</div><div class="task-meta">${sub}</div></div><span class="tag ${t.type}">${type}</span><button class="delete" data-delete="${t.id}" aria-label="حذف المهمة">×</button></article>`}).join(''):`<div class="empty"><div>${filter==='done'?'🌼':'☁️'}</div><b>${filter==='done'?'لسه ما في مهام مكتملة':'ما في مهام هون حالياً'}</b><small>${filter==='done'?'كل إنجاز صغير بيستاهل الاحتفال!':'استمتعي بوقتك، أو أضيفي مهمة جديدة 💗'}</small></div>`;
}
function renderDays(){let html='';for(let i=-3;i<=3;i++){let d=new Date(selectedDate);d.setDate(d.getDate()+i);let k=keyDate(d);html+=`<button class="day ${i===0?'active':''}" data-day="${k}"><small>${SHORT[d.getDay()]}</small><b>${d.getDate()}</b><em>${d.toLocaleDateString('ar',{month:'short'})}</em></button>`}$('dayNav').innerHTML=html;$('weekCaption').textContent=`${selectedDate.toLocaleDateString('ar',{month:'long',year:'numeric'})} · اختاري يوماً لعرض مهامه`}
$('jumpDate').addEventListener('change',e=>{if(e.target.value){selectedDate=parseDate(e.target.value);filter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render()}});
$('dayNav').addEventListener('click',e=>{let b=e.target.closest('[data-day]');if(b){selectedDate=parseDate(b.dataset.day);filter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render()}});
$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
$('taskList').addEventListener('click',e=>{let c=e.target.closest('[data-check]'),d=e.target.closest('[data-delete]');if(c){let t=tasks.find(x=>x.id===c.dataset.check);t.completed??={};let k=keyDate(selectedDate);if(t.completed[k])delete t.completed[k];else t.completed[k]=true;save();render()}if(d){tasks=tasks.filter(x=>x.id!==d.dataset.delete);save();render();toast('انحذفت المهمة 🌷')}});
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function updateType(){let type=$('taskType').value;$('weekField').hidden=type!=='weekly';$('dateField').hidden=type!=='once'}$('taskType').addEventListener('change',updateType);
DAYS.forEach((d,i)=>{let b=document.createElement('button');b.type='button';b.textContent=SHORT[i];b.dataset.week=i;b.style.cssText='border:1px solid #efdddf;background:white;border-radius:10px;padding:7px 10px;color:#987783;font-size:11px';b.addEventListener('click',()=>{b.classList.toggle('chosen');b.style.background=b.classList.contains('chosen')?'#f4dce3':'white';b.style.borderColor=b.classList.contains('chosen')?'#d69aaa':'#efdddf'});$('weekDays').appendChild(b)});
function open(){ $('overlay').classList.add('show');$('taskName').focus()}function close(){ $('overlay').classList.remove('show');$('taskForm').reset();$('weekDays').querySelectorAll('button').forEach(b=>{b.classList.remove('chosen');b.style.background='white';b.style.borderColor='#efdddf'});updateType()}
$('openModal').addEventListener('click',open);$('closeModal').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});
$('taskForm').addEventListener('submit',e=>{e.preventDefault();let name=$('taskName').value.trim(),type=$('taskType').value;if(!name)return;let item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,type,completed:{}};if(type==='weekly'){item.days=[...$('weekDays').querySelectorAll('.chosen')].map(b=>Number(b.dataset.week));if(!item.days.length){toast('اختاري يوم واحد على الأقل 💗');return}}if(type==='once'){item.date=$('taskDate').value||keyDate(selectedDate);if(item.date<keyDate(new Date())){toast('اختاري تاريخ اليوم أو تاريخ بالمستقبل');return}}tasks.push(item);save();close();filter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render();toast('انضافت مهمتك بنجاح 🌸')});
$('taskDate').value=keyDate(selectedDate);render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
