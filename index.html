<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f5">
  <meta name="description" content="Daily Bloom — مساحة لطيفة لتنظيم المهام والعادات والتمارين.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Bloom">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Daily Bloom — يومك بلطف</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Daily Bloom الرئيسية">
        <span class="brand-mark">✿</span>
        <span class="brand-copy"><strong>Daily Bloom</strong><small>خطوة صغيرة، يوم أجمل</small></span>
      </a>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite">
      <div class="loading-card"><span class="loading-flower">🌷</span><p>عم نجهّز مساحتك اللطيفة...</p></div>
    </main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-item active" data-page="home" type="button"><span>⌂</span><small>الرئيسية</small></button>
      <button class="nav-item" data-page="planner" type="button"><span>▦</span><small>التقويم</small></button>
      <button class="nav-item" data-page="fitness" type="button"><span>♧</span><small>الرياضة</small></button>
      <button class="nav-item" data-page="habits" type="button"><span>♡</span><small>العادات</small></button>
    </nav>
  </div>

  <dialog id="taskDialog" class="app-dialog">
    <form id="taskForm" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">YOUR LITTLE PLAN</span><h2 id="taskDialogTitle">مهمة جديدة ✿</h2></div><button class="icon-button" type="button" data-close-dialog="taskDialog" aria-label="إغلاق">×</button></div>
      <label class="field"><span>اسم المهمة</span><input id="taskName" maxlength="100" placeholder="مثلاً: مراجعة محاضرة قواعد البيانات" required></label>
      <div class="field-grid">
        <label class="field"><span>التكرار</span><select id="taskType"><option value="daily">كل يوم</option><option value="weekly">أيام محددة</option><option value="once">مرة واحدة</option></select></label>
        <label class="field"><span>التصنيف</span><select id="taskCategory"></select></label>
      </div>
      <div id="taskWeekdayField" class="field" hidden><span class="field-label">أيام التكرار</span><div id="taskWeekdayChoices" class="weekday-choices"></div></div>
      <label id="taskDateField" class="field" hidden><span>تاريخ المهمة</span><input id="taskDate" type="date"></label>
      <label class="field"><span>الأولوية</span><select id="taskPriority"><option value="medium">متوسطة</option><option value="high">عالية</option><option value="low">منخفضة</option></select></label>
      <div id="taskEditScopeField" class="field" hidden><span class="field-label">نطاق التعديل</span><div class="scope-options"><label><input type="radio" name="taskEditScope" value="occurrence" checked><span>هذا اليوم فقط</span></label><label><input type="radio" name="taskEditScope" value="future"><span>من هذا اليوم وما بعده</span></label></div></div>
      <div class="dialog-actions"><button class="button button-primary" type="submit">حفظ المهمة</button><button class="button button-quiet" type="button" data-close-dialog="taskDialog">إلغاء</button></div>
    </form>
  </dialog>

  <dialog id="deleteTaskDialog" class="app-dialog compact-dialog">
    <form id="deleteTaskForm" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">TASK OPTIONS</span><h2>كيف بدك تتعاملي معها؟</h2></div><button class="icon-button" type="button" data-close-dialog="deleteTaskDialog" aria-label="إغلاق">×</button></div>
      <p class="dialog-description" id="deleteTaskDescription"></p>
      <div class="scope-options stacked"><label><input type="radio" name="deleteTaskScope" value="skip" checked><span><b>إخفاء لهذا اليوم</b><small>تبقى المهمة في بقية أيام تكرارها.</small></span></label><label><input type="radio" name="deleteTaskScope" value="future"><span><b>إنهاء المهمة من هذا اليوم</b><small>تحافظ على سجل الأيام السابقة ولا تظهر لاحقاً.</small></span></label><label><input type="radio" name="deleteTaskScope" value="all"><span><b>حذف المهمة نهائياً</b><small>حذف السلسلة كاملة من قائمة مهامك.</small></span></label></div>
      <div class="dialog-actions"><button class="button button-danger" type="submit">تأكيد</button><button class="button button-quiet" type="button" data-close-dialog="deleteTaskDialog">إلغاء</button></div>
    </form>
  </dialog>

  <dialog id="habitDialog" class="app-dialog">
    <form id="habitForm" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">A GENTLE ROUTINE</span><h2 id="habitDialogTitle">عادة جديدة ♡</h2></div><button class="icon-button" type="button" data-close-dialog="habitDialog" aria-label="إغلاق">×</button></div>
      <label class="field"><span>اسم العادة</span><input id="habitName" maxlength="80" placeholder="مثلاً: شرب 8 أكواب ماء" required></label>
      <div class="field-grid"><label class="field"><span>التكرار</span><select id="habitType"><option value="daily">كل يوم</option><option value="weekly">أيام محددة</option></select></label><label class="field"><span>التصنيف</span><select id="habitCategory"></select></label></div>
      <div id="habitWeekdayField" class="field" hidden><span class="field-label">أيام العادة</span><div id="habitWeekdayChoices" class="weekday-choices"></div></div>
      <div class="dialog-actions"><button class="button button-primary" type="submit">حفظ العادة</button><button class="button button-quiet" type="button" data-close-dialog="habitDialog">إلغاء</button></div>
    </form>
  </dialog>

  <dialog id="workoutDialog" class="app-dialog workout-dialog">
    <form id="workoutForm" class="dialog-form">
      <div class="dialog-heading"><div><span class="eyebrow">MOVE WITH LOVE</span><h2 id="workoutDialogTitle">جلسة رياضية جديدة ♧</h2></div><button class="icon-button" type="button" data-close-dialog="workoutDialog" aria-label="إغلاق">×</button></div>
      <label class="field"><span>اسم الجلسة</span><input id="workoutTitle" maxlength="80" placeholder="مثلاً: يوم الأرجل" required></label>
      <label class="field"><span>ملاحظات (اختياري)</span><input id="workoutNotes" maxlength="180" placeholder="كيف حابة تكون الجلسة؟"></label>
      <div class="form-section-heading"><div><b>التمارين</b><small>أضيفي كل تمرين وعدد مجموعاته والعدات والوزن.</small></div><button type="button" class="button button-small button-soft" id="addExerciseButton">＋ تمرين</button></div>
      <div id="exerciseFormList" class="exercise-form-list"></div>
      <div class="dialog-actions"><button class="button button-primary" type="submit">حفظ الجلسة</button><button class="button button-quiet" type="button" data-close-dialog="workoutDialog">إلغاء</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
